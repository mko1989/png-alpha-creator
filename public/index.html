<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create PNG alpha masks in the browser: edge fades, vignettes, feathered shapes and gradients. Exports alpha PNGs and B/W key mattes. Free and open source; nothing is uploaded.">
  <title>PNG Alpha Creator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='.35' stop-color='%23fff'/%3E%3Cstop offset='1' stop-color='%23000'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/core.js">
  <link rel="modulepreload" href="js/presets.js">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span>PNG Alpha Creator</div>

    <div class="group presets" title="Presets: built-in ones keep the current resolution; saved ones restore theirs">
      <select id="presetSelect" aria-label="Load preset"></select>
      <button id="presetSave" title="Save current mask as a preset in this browser">Save</button>
      <button id="presetDelete" class="icon" title="Delete selected saved preset">✕</button>
      <button id="presetImport" class="icon" title="Import presets from a .json file (or drop it on the canvas)" aria-label="Import presets">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10V2M4.5 5.5 8 2l3.5 3.5M2.5 11v2.5h11V11"/></svg>
      </button>
      <button id="presetExport" class="icon" title="Export your saved presets as a .json file" aria-label="Export presets">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 11v2.5h11V11"/></svg>
      </button>
      <input type="file" id="presetFile" accept=".json,application/json" hidden>
    </div>

    <div class="group history">
      <button id="undoBtn" class="icon" title="Undo (Ctrl/⌘+Z)">↶</button>
      <button id="redoBtn" class="icon" title="Redo (Ctrl/⌘+Shift+Z)">↷</button>
    </div>

    <div class="group seg" id="viewModes" role="group" aria-label="Preview mode">
      <button data-view="matte" title="Grayscale matte (white = opaque)">Matte</button>
      <button data-view="checker" title="White with alpha over a checkerboard">Alpha</button>
      <button data-view="cut" title="Reference image (or a test card) with the mask applied">Cut-out</button>
      <button data-view="overlay" title="Reference image (or a test card) with masked-out areas tinted red">Overlay</button>
    </div>
    <button id="loadImage" title="Load a reference image to preview the mask on (or drop one on the canvas)">Image…</button>
    <input type="file" id="imageFile" accept="image/*" hidden>

    <div class="spacer"></div>

    <div class="group export">
      <input id="fileName" value="mask" spellcheck="false" aria-label="File name" title="File name (format suffix is added)">
      <select id="format" aria-label="Export format"></select>
      <button id="exportBtn" class="primary" title="Export PNG (Ctrl/⌘+E)">Export PNG</button>
    </div>
  </header>

  <main>
    <aside class="panel left">
      <section>
        <h3>Document</h3>
        <div class="row">
          <select id="sizePreset" aria-label="Resolution preset"></select>
        </div>
        <div class="row size">
          <input type="number" id="docW" min="1" max="16384" aria-label="Width">
          <span>×</span>
          <input type="number" id="docH" min="1" max="16384" aria-label="Height">
          <button id="swapWH" class="icon" title="Swap width/height">⇄</button>
          <button id="imgSize" class="icon" title="Use reference image size" disabled>⤢</button>
        </div>
        <div id="docControls"></div>
      </section>

      <section>
        <h3>Add shape</h3>
        <div class="addgrid" id="addShape"></div>
      </section>

      <section class="grow">
        <h3>Layers <span class="hint">top applies last</span></h3>
        <div id="layerList" class="layers"></div>
        <div class="layer-actions">
          <button id="layerUp" class="icon" title="Move up (])">↑</button>
          <button id="layerDown" class="icon" title="Move down ([)">↓</button>
          <button id="layerDup" class="icon" title="Duplicate (Ctrl/⌘+D)">⧉</button>
          <button id="layerDel" class="icon danger" title="Delete (Del)">🗑</button>
        </div>
      </section>
    </aside>

    <div class="center">
      <div id="viewport" tabindex="-1">
        <div id="stage"><canvas id="display"></canvas></div>
        <canvas id="overlay"></canvas>
        <div id="dropHint">Drop an image (reference) or a .json (presets)</div>
      </div>
      <footer class="statusbar">
        <div class="group">
          <button id="zoomOut" class="icon" title="Zoom out (-)">−</button>
          <select id="zoomSel" aria-label="Zoom">
            <option value="fit">Fit</option>
            <option value="0.25">25%</option><option value="0.5">50%</option><option value="1">100%</option>
            <option value="2">200%</option><option value="4">400%</option><option value="8">800%</option>
            <option value="16">1600%</option><option value="32">3200%</option>
            <option value="custom" hidden></option>
          </select>
          <button id="zoomIn" class="icon" title="Zoom in (+)">+</button>
          <button id="zoomFit" title="Fit (0)">Fit</button>
          <button id="zoom100" title="Actual pixels (1)">1:1</button>
        </div>
        <span id="readout" class="mono"></span>
        <span class="spacer"></span>
        <span id="renderInfo" class="mono dim"></span>
        <span class="dim hints">Drag moves shapes · Shift snaps · Space/right-drag pans · wheel zooms</span>
      </footer>
    </div>

    <aside class="panel right">
      <h3 id="propsTitle">Layer</h3>
      <div id="props"></div>
    </aside>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
